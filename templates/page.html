{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
<header>
  <h1 class="title">{{ page.title }}</h1>
  {% if page.date %}
  <p class="timestamp"><time datetime="{{ page.date }}">{{ page.date }}</time></p>
  {% endif %}
</header>
{{ page.content | safe }}
{% endblock content %}
