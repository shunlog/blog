{% extends "base.html" %}

{% block title %}{{ section.title }}{% endblock title %}

{% block content %}
<header>
  <h1 class="title">{{ section.title }}</h1>
</header>
{{ section.content | safe }}
<ul>
  {% for page in section.pages %}
  <li><span class="timestamp">[{{ page.date }}]</span> <a href="{{ page.permalink }}">{{ page.title }}</a></li>
  {% endfor %}
</ul>
{% endblock content %}
